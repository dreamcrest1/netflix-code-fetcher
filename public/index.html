<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Email Fetcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-3 sm:p-4 md:p-6 font-sans overflow-x-hidden">

  <div class="w-full max-w-xl my-auto space-y-4 sm:space-y-6">
    <div class="text-center space-y-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-red-600/10 border border-red-600/30 text-red-500 rounded-full text-xs font-semibold uppercase">
        <i class="fa-solid fa-envelope-open-text"></i> Latest Email Portal
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-white">Fetch Latest Email</h1>
      <p class="text-zinc-400 text-sm">Select your assigned email address to view the most recent email received in the inbox.</p>
    </div>

    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-2xl space-y-4">
      <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Select Assigned Email</label>
      <div class="space-y-3">
        <select id="emailSelect" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-100 rounded-xl px-3 sm:px-4 py-2 sm:py-3 text-sm focus:ring-2 focus:ring-red-600 outline-none appearance-none">
          <option value="nf2m@dreamcrest.net">nf2m@dreamcrest.net</option>
          <option value="p3m@dreamespire.com">p3m@dreamespire.com</option>
          <option value="df3@dreamespire.com">df3@dreamespire.com</option>
          <option value="nf3m@dreamcrest.net">nf3m@dreamcrest.net</option>
        </select>
        <button id="fetchBtn" onclick="fetchEmail()" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-semibold py-2 sm:py-3 px-4 sm:px-6 rounded-xl transition-all shadow-lg shadow-red-600/20 text-sm sm:text-base">
          <i id="btnIcon" class="fa-solid fa-rotate-right"></i>
          <span id="btnText">Fetch Email</span>
        </button>
      </div>
    </div>

    <div id="errorBox" class="hidden bg-red-950/40 border border-red-600/40 text-red-300 p-4 rounded-xl text-sm flex items-center gap-3">
      <i class="fa-solid fa-circle-exclamation text-red-500"></i>
      <span id="errorMessage">Unable to fetch mail.</span>
    </div>

    <div id="resultBox" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl overflow-hidden max-w-full">
      <div class="border-b border-zinc-800 p-3 sm:p-4 md:p-5 space-y-3">
        <div class="flex items-start justify-between gap-4">
          <h2 id="emailSubject" class="text-base font-semibold text-white leading-snug">---</h2>
          <span id="emailTime" class="shrink-0 text-xs bg-zinc-950 border border-zinc-800 text-zinc-400 px-2 py-1 rounded whitespace-nowrap">--</span>
        </div>
        <div class="space-y-1 text-xs">
          <div class="flex gap-2">
            <span class="text-zinc-500 font-semibold uppercase w-12 shrink-0">From</span>
            <span id="emailFrom" class="text-zinc-300 break-all">---</span>
          </div>
          <div class="flex gap-2">
            <span class="text-zinc-500 font-semibold uppercase w-12 shrink-0">To</span>
            <span id="emailTo" class="text-zinc-300 break-all">---</span>
          </div>
        </div>
      </div>

      <div class="p-4 sm:p-5">
        <span class="text-xs text-zinc-500 font-semibold uppercase">Email Content</span>
        <div id="emailBody" class="mt-2 bg-white text-zinc-900 rounded-xl overflow-hidden w-full">
          <iframe id="emailFrame" class="w-full rounded-xl bg-white" style="min-height: 300px; max-height: 600px; height: auto; border: 0; display: block;" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" title="Email content"></iframe>
        </div>
        <pre id="emailText" class="hidden mt-2 whitespace-pre-wrap break-words bg-zinc-950 border border-zinc-800 text-zinc-200 rounded-xl p-3 sm:p-4 text-xs sm:text-sm leading-relaxed font-mono max-h-60 sm:max-h-96 overflow-auto"></pre>
      </div>
    </div>
  </div>

  <footer class="text-xs text-zinc-600 py-4">Hosted on netflix.dreamcrest.net</footer>

  <script>
    async function fetchEmail() {
      const email = document.getElementById('emailSelect').value;
      const fetchBtn = document.getElementById('fetchBtn');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');

      fetchBtn.disabled = true;
      btnIcon.classList.add('fa-spin');
      btnText.innerText = "Connecting...";

      document.getElementById('errorBox').classList.add('hidden');

      try {
        const res = await fetch('/api/fetch-latest-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        const result = await res.json();

        if (!res.ok || !result.success) throw new Error(result.message || 'Error fetching email');

        const data = result.data;
        document.getElementById('emailSubject').innerText = data.subject || "No Subject";
        document.getElementById('emailFrom').innerText = data.from || "Unknown";
        document.getElementById('emailTo').innerText = data.to || email;
        document.getElementById('emailTime').innerText = new Date(data.date).toLocaleString([], {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const frame = document.getElementById('emailFrame');
        const textEl = document.getElementById('emailText');

        if (data.html) {
          // Render the full HTML email safely inside a sandboxed iframe.
          frame.classList.remove('hidden');
          textEl.classList.add('hidden');
          frame.srcdoc = data.html;
        } else {
          // Fall back to plain-text body.
          frame.classList.add('hidden');
          textEl.classList.remove('hidden');
          textEl.innerText = data.text || "(This email has no readable content.)";
        }

        document.getElementById('resultBox').classList.remove('hidden');
      } catch(err) {
        document.getElementById('errorMessage').innerText = err.message;
        document.getElementById('errorBox').classList.remove('hidden');
      } finally {
        fetchBtn.disabled = false;
        btnIcon.classList.remove('fa-spin');
        btnText.innerText = "Fetch Email";
      }
    }

    // Auto-resize the iframe to fit the full email once it loads and handle link clicking
    document.getElementById('emailFrame').addEventListener('load', function () {
      try {
        const doc = this.contentDocument || this.contentWindow.document;
        if (doc && doc.body) {
          // Calculate height and apply it
          const scrollHeight = doc.body.scrollHeight;
          const newHeight = Math.min(scrollHeight + 32, 600);
          this.style.height = newHeight + 'px';
          
          // Make all links open in new tabs
          const links = doc.querySelectorAll('a');
          links.forEach(link => {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
            link.addEventListener('click', function(e) {
              const href = this.getAttribute('href');
              if (href && !href.startsWith('javascript:')) {
                e.preventDefault();
                window.open(href, '_blank', 'noopener,noreferrer');
              }
            });
          });
          
          // Also inject a MutationObserver to handle dynamically added links
          const observer = new MutationObserver(() => {
            const newLinks = doc.querySelectorAll('a:not([data-handled])');
            newLinks.forEach(link => {
              link.setAttribute('target', '_blank');
              link.setAttribute('rel', 'noopener noreferrer');
              link.setAttribute('data-handled', 'true');
              link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('javascript:')) {
                  e.preventDefault();
                  window.open(href, '_blank', 'noopener,noreferrer');
                }
              });
            });
          });
          observer.observe(doc.body, { childList: true, subtree: true });
        }
      } catch (e) { /* cross-origin, keep default height */ }
    });
  </script>
</body>
</html>
